name: Build Release Bundle

# Triggered by the TAG PUSH, not by `release: published`.
#
# The release must not be visible until its assets exist. With a
# `release: published` trigger there is a window — from the moment the release
# is published to the moment this job finishes uploading — where the tag is
# already "latest" but the tarball is not there yet, and any `install.sh` run
# in that window fails with "Failed to download <version>". Promoting a draft
# does not help: GitHub fires no workflow for draft-release activity, and
# un-drafting fires `published`, which lands in the same window.
#
# So: the tag push starts the build, `octopus release create-gh-release`
# creates the release as a DRAFT, and this job un-drafts it only after the
# assets are attached. A failed build leaves the release invisible rather than
# broken.
on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.2

      - name: Download fzf binaries
        shell: bash
        run: |
          FZF_VERSION="v0.72.0"
          FZF_VER="${FZF_VERSION#v}"  # strip leading 'v' for asset filenames
          BASE="https://github.com/junegunn/fzf/releases/download/${FZF_VERSION}"

          mkdir -p bin/fzf/linux-amd64 bin/fzf/linux-arm64 bin/fzf/darwin-amd64 bin/fzf/darwin-arm64 bin/fzf/windows-amd64

          curl -fsSL "${BASE}/fzf-${FZF_VER}-linux_amd64.tar.gz"  | tar -xz -C bin/fzf/linux-amd64 fzf
          curl -fsSL "${BASE}/fzf-${FZF_VER}-linux_arm64.tar.gz"  | tar -xz -C bin/fzf/linux-arm64 fzf
          curl -fsSL "${BASE}/fzf-${FZF_VER}-darwin_amd64.tar.gz" | tar -xz -C bin/fzf/darwin-amd64 fzf
          curl -fsSL "${BASE}/fzf-${FZF_VER}-darwin_arm64.tar.gz" | tar -xz -C bin/fzf/darwin-arm64 fzf
          curl -fsSL "${BASE}/fzf-${FZF_VER}-windows_amd64.zip" -o /tmp/fzf-windows-amd64.zip && unzip -q /tmp/fzf-windows-amd64.zip -d bin/fzf/windows-amd64

          chmod +x bin/fzf/linux-amd64/fzf bin/fzf/linux-arm64/fzf bin/fzf/darwin-amd64/fzf bin/fzf/darwin-arm64/fzf || true
          echo "fzf binaries ready for packaging"

      - name: Create release archive
        shell: bash
        run: |
          TAG="${GITHUB_REF##*/}"
          # Wrap content in octopus-<tag>/ so install.sh can find it via find -name 'octopus-*'
          tar -czf "/tmp/octopus-${TAG}.tar.gz" \
            --exclude .git --exclude .github \
            --transform "s,^\./,octopus-${TAG}/," \
            -C "$GITHUB_WORKSPACE" .
          sha256sum "/tmp/octopus-${TAG}.tar.gz" > "/tmp/octopus-${TAG}.sha256"

      # RM-020 — Sign the tarball with the maintainer's GPG key so install.sh
      # can verify integrity via `gpg --verify` (see docs/specs/signed-releases.md).
      # Fails the workflow if secrets are missing to avoid shipping a partial,
      # unsigned release by accident.
      - name: Sign tarball with GPG
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.OCTOPUS_RELEASE_GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.OCTOPUS_RELEASE_GPG_PASSPHRASE }}
        run: |
          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "::error::OCTOPUS_RELEASE_GPG_KEY secret is not configured. See docs/specs/release-signing-pipeline.md for setup."
            exit 1
          fi
          if [[ -z "${GPG_PASSPHRASE:-}" ]]; then
            echo "::error::OCTOPUS_RELEASE_GPG_PASSPHRASE secret is not configured."
            exit 1
          fi

          TAG="${GITHUB_REF##*/}"
          TARBALL="/tmp/octopus-${TAG}.tar.gz"

          # Import the private key into a temporary keyring
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

          KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
          if [[ -z "$KEY_ID" ]]; then
            echo "::error::Imported GPG key list is empty."
            exit 1
          fi

          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --local-user "$KEY_ID" \
            --detach-sign --armor \
            --output "${TARBALL}.asc" "$TARBALL"

      # The tag push and `gh release create --draft` are two separate steps on
      # the maintainer's machine, so the draft may not exist yet when this
      # runner starts. Wait for it rather than racing it.
      - name: Wait for the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG found after ${i} attempt(s)."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Release $TAG never appeared after 5 minutes. Create it with 'octopus release create-gh-release ${TAG#v} <notes-file>'."
          exit 1

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          gh release upload "$TAG" \
            "/tmp/octopus-${TAG}.tar.gz" \
            "/tmp/octopus-${TAG}.sha256" \
            "/tmp/octopus-${TAG}.tar.gz.asc" \
            install.sh \
            install.ps1 \
            --clobber

      # Only now is the release safe to show. Everything above must have
      # succeeded — a failed build leaves a draft, which nobody can install
      # by accident.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          gh release edit "$TAG" --draft=false
          echo "Release $TAG published with assets attached.
